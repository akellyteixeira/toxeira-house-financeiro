
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ToxeiraHouse Financeiro</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="login-page">
        <section class="logo-area">
            <img
                src="assets/logo/Sem título.png"
                alt="ToxeiraHouse Financeiro"
                class="logo"
            >
        </section>
        <section class="form-area">
            <div class="login-card">
                <h1>Faça o seu login:</h1>
                <form id="login-form" action="#" method="post">
                    <div class="form-group">
                        <label for="email">Seu e-mail*</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="password">Sua senha*</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                    <div class="remember-area">

                        <input
                            type="checkbox"
                            id="remember"
                            name="remember"
                        >

                        <label for="remember">Lembrar-me</label>

                    </div>

                    <!-- Botão entrar -->
                    <button
                        type="submit"
                        class="login-button"
                        aria-label="Entrar"
                    >

                        <!-- Adicione sua seta em assets/seta-entrar.png -->
                        <img
                            src="assets/icons/seta-direita.png"
                            alt=""
                            class="arrow-icon"
                        >

                    </button>

                    <!-- Link para cadastro -->
                    <div class="register-area">

                        <a href="cadastro.html">Criar conta!</a>

                    </div>

                </form>

            </div>

        </section>

    </main>
    <script src="js/login.js"></script>
</body>
</body>
</html>
